services:
  # Relational and vector database running PostgreSQL 17 with pgvector and strict RLS
  postgres:
    image: pgvector/pgvector:pg17
    container_name: b2b_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-b2b_lead_qualifier}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - b2b_pgdata:/var/lib/postgresql/data
      - ./db/bootstrap:/docker-entrypoint-initdb.d:ro
      - ./db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER:-postgres} -d ${DB_NAME:-b2b_lead_qualifier}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Automated migration runner executed before starting the API
  migrator:
    image: ghcr.io/amacneil/dbmate:2
    container_name: b2b_migrator
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_ADMIN_USER:-postgres}:${DB_ADMIN_PASSWORD}@postgres:5432/${DB_NAME:-b2b_lead_qualifier}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db:/db:ro
    command: ["up"]

  # FastAPI application service (B2B Lead Qualifier)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: b2b-lead-qualifier:latest
    container_name: b2b_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "127.0.0.1:8000:8000"

  # Caddy reverse proxy for automatic Let's Encrypt TLS
  caddy:
    image: caddy:2-alpine
    container_name: b2b_caddy
    restart: unless-stopped
    profiles: ["prod", "proxy"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - b2b_caddy_data:/data
      - b2b_caddy_config:/config

  # On-demand dbmate service for manual migration commands (up, rollback, status)
  dbmate:
    image: ghcr.io/amacneil/dbmate:2
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_ADMIN_USER:-postgres}:${DB_ADMIN_PASSWORD}@postgres:5432/${DB_NAME:-b2b_lead_qualifier}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db:/db:ro

volumes:
  b2b_pgdata:
  b2b_caddy_data:
  b2b_caddy_config:
