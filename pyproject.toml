[project]
name = "b2b-lead-qualifier"
version = "0.1.0"
description = "Conversational B2B lead qualification service: multi-tenant PostgreSQL 17 + pgvector, deterministic scoring core, FastAPI and LLM edge."
readme = "README.md"
authors = [
    { name = "Renan Maciel" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "openai>=3.26.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
b2b-lead-qualifier = "lead_qualifier.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lead_qualifier"
module-root = "src"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.15.0",
    "pillow>=13.0.0",
    "pre-commit>=4.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "websockets>=17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "psycopg_pool.*",
    "pytest_asyncio.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
