name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Ruff Lint
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Run Mypy Typecheck
        run: uv run mypy src tests

  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: b2b_lead_qualifier
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Install dbmate
        run: |
          sudo curl -fsSL -o /usr/local/bin/dbmate https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          sudo chmod +x /usr/local/bin/dbmate

      - name: Bootstrap and Migrate Database
        env:
          DATABASE_URL: postgresql://postgres:secret@127.0.0.1:5432/b2b_lead_qualifier?sslmode=disable
        run: |
          PGPASSWORD=secret psql -h 127.0.0.1 -U postgres -d b2b_lead_qualifier -v app_password=secret -f db/bootstrap/create_app_role.psql
          dbmate --migrations-dir db/migrations up
          PGPASSWORD=secret psql -h 127.0.0.1 -U postgres -d b2b_lead_qualifier -f db/seeds/demo.sql

      - name: Run Tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: b2b_lead_qualifier
          DB_USER: app_user
          DB_PASSWORD: secret
          DB_ADMIN_USER: postgres
          DB_ADMIN_PASSWORD: secret
          ADMIN_DATABASE_URL: postgresql://postgres:secret@127.0.0.1:5432/b2b_lead_qualifier
          LLM_PROVIDER: fake
        run: uv run pytest -v

  docker-smoke:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare environment configuration
        run: cp .env.example .env

      - name: Build image and start stack
        run: docker compose up -d --build

      - name: Wait for API health check
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "API is healthy!"
              curl -s http://127.0.0.1:8000/health
              exit 0
            fi
            echo "Waiting for API... (attempt $i/30)"
            sleep 2
          done
          echo "API failed to become healthy within 60s"
          docker compose logs
          exit 1

      - name: Read expected version from pyproject.toml
        id: project
        run: |
          echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"

      - name: Verify package installed and importable in container
        env:
          EXPECTED_VERSION: ${{ steps.project.outputs.version }}
        run: |
          docker compose exec -T -e EXPECTED_VERSION api python -c "
          import importlib, importlib.metadata as m, os
          importlib.import_module('lead_qualifier')
          installed = m.version('b2b-lead-qualifier')
          expected = os.environ['EXPECTED_VERSION']
          assert installed == expected, f'installed={installed} expected={expected}'
          print(f'b2b-lead-qualifier {installed} importable')
          "

      - name: Teardown stack
        if: always()
        run: docker compose down -v
