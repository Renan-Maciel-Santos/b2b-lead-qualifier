<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B Lead Qualifier | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --brand-primary: #38bdf8;
            --brand-secondary: #818cf8;
            --accent-glow: rgba(56, 189, 248, 0.35);
            --qual-color: #10b981;
            --disq-color: #ef4444;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            background-image:
                radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.12), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(129, 140, 248, 0.12), transparent 25%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 1.5rem 0;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--brand-primary), var(--brand-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .auth-bar {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 999px;
            padding: 0.4rem 0.6rem 0.4rem 1.2rem;
            backdrop-filter: blur(8px);
        }

        .auth-bar input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.9rem;
            width: 280px;
            outline: none;
        }

        .auth-bar input::placeholder {
            color: var(--text-muted);
        }

        .auth-bar button {
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
            border: none;
            color: #0f172a;
            font-family: inherit;
            font-weight: 600;
            padding: 0.5rem 1.2rem;
            border-radius: 999px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .auth-bar button:hover {
            opacity: 0.9;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .stat-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .stat-value {
            font-size: 2.8rem;
            font-weight: 700;
            margin: 0.5rem 0;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .leads-table-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1.2rem;
            border-bottom: 1px solid var(--glass-border);
        }

        th {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        tr {
            transition: background 0.2s ease;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .badge {
            padding: 0.35rem 0.9rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
        }

        .badge.qualified {
            background: rgba(16, 185, 129, 0.15);
            color: var(--qual-color);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge.disqualified {
            background: rgba(239, 68, 68, 0.15);
            color: var(--disq-color);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .audit-trail {
            font-size: 0.85rem;
            color: var(--text-muted);
            max-width: 440px;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .audit-item {
            display: block;
            padding: 0.25rem 0.5rem;
            background: rgba(255, 255, 255, 0.03);
            border-left: 2px solid var(--accent);
            border-radius: 0 4px 4px 0;
            word-break: break-word;
        }

        .audit-item.empty {
            border-left: 2px solid var(--glass-border);
            color: var(--text-muted);
            background: transparent;
            font-style: italic;
        }

        .auth-prompt {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 3rem;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .loading-spinner {
            margin: 3rem auto;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--brand-primary);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <h1>B2B Lead Qualifier</h1>
        <div class="auth-bar">
            <input type="password" id="apiKeyInput" placeholder="Operator API Key (Bearer Token)" autocomplete="off">
            <button id="connectBtn" type="button">Connect</button>
        </div>
    </header>

    <div class="container">
        <div id="authPrompt" class="auth-prompt" style="display: none;">
            <h2>Authentication Required</h2>
            <p style="color: var(--text-muted);">Please enter a valid Operator API Key above to load lead qualification data.</p>
        </div>

        <div id="loading" class="loading-spinner" style="display: none;"></div>

        <div id="content" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Leads</div>
                    <div class="stat-value" id="totalLeads">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Qualified</div>
                    <div class="stat-value" id="totalQualified" style="color: var(--qual-color);">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Disqualified</div>
                    <div class="stat-value" id="totalDisqualified" style="color: var(--disq-color);">0</div>
                </div>
            </div>

            <div class="leads-table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Phone</th>
                            <th>Status</th>
                            <th>Final Score</th>
                            <th>Evaluation Date</th>
                            <th>Audit Trail</th>
                        </tr>
                    </thead>
                    <tbody id="leadsTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const apiKeyInput = document.getElementById('apiKeyInput');
        const connectBtn = document.getElementById('connectBtn');
        const authPrompt = document.getElementById('authPrompt');
        const loading = document.getElementById('loading');
        const content = document.getElementById('content');
        const tableBody = document.getElementById('leadsTableBody');

        const savedKey = sessionStorage.getItem('b2b_operator_key');
        if (savedKey) {
            apiKeyInput.value = savedKey;
        }

        connectBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (!key) {
                alert('Please enter an API key.');
                return;
            }
            sessionStorage.setItem('b2b_operator_key', key);
            fetchLeads(key);
        });

        async function fetchLeads(apiKey) {
            if (!apiKey) {
                authPrompt.style.display = 'block';
                content.style.display = 'none';
                loading.style.display = 'none';
                return;
            }

            authPrompt.style.display = 'none';
            loading.style.display = 'block';
            content.style.display = 'none';

            try {
                const response = await fetch('/v1/leads', {
                    headers: {
                        'Authorization': 'Bearer ' + apiKey
                    }
                });

                if (response.status === 401) {
                    loading.style.display = 'none';
                    authPrompt.style.display = 'block';
                    alert('Invalid or revoked API key.');
                    return;
                }

                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }

                const data = await response.json();
                const leads = data.leads || [];

                document.getElementById('totalLeads').textContent = String(leads.length);
                document.getElementById('totalQualified').textContent = String(leads.filter(l => l.is_qualified).length);
                document.getElementById('totalDisqualified').textContent = String(leads.filter(l => !l.is_qualified).length);

                // Safe DOM building: textContent and createElement ONLY to strictly prevent XSS
                while (tableBody.firstChild) {
                    tableBody.removeChild(tableBody.firstChild);
                }

                leads.forEach(lead => {
                    const tr = document.createElement('tr');

                    // Phone column
                    const tdPhone = document.createElement('td');
                    tdPhone.style.fontWeight = '600';
                    tdPhone.textContent = String(lead.phone_number || '');
                    tr.appendChild(tdPhone);

                    // Status column
                    const tdStatus = document.createElement('td');
                    const badge = document.createElement('span');
                    badge.className = 'badge ' + (lead.is_qualified ? 'qualified' : 'disqualified');
                    badge.textContent = lead.is_qualified ? 'QUALIFIED' : 'DISQUALIFIED';
                    tdStatus.appendChild(badge);
                    tr.appendChild(tdStatus);

                    // Score column
                    const tdScore = document.createElement('td');
                    const strongScore = document.createElement('strong');
                    const score = Number(lead.final_score) || 0;
                    strongScore.style.color = score > 0 ? 'var(--qual-color)' : (score < 0 ? 'var(--disq-color)' : 'white');
                    strongScore.textContent = score + ' pts';
                    tdScore.appendChild(strongScore);
                    tr.appendChild(tdScore);

                    // Date column
                    const tdDate = document.createElement('td');
                    tdDate.style.color = 'var(--text-muted)';
                    tdDate.style.fontSize = '0.9rem';
                    tdDate.textContent = lead.created_at ? new Date(lead.created_at).toLocaleString('pt-BR') : '-';
                    tr.appendChild(tdDate);

                    // Audit trail column
                    const tdAudit = document.createElement('td');
                    const auditDiv = document.createElement('div');
                    auditDiv.className = 'audit-trail';
                    const reasons = Array.isArray(lead.audit_trail)
                        ? lead.audit_trail
                        : (Array.isArray(lead.reasons) ? lead.reasons : []);

                    if (reasons.length === 0) {
                        const emptyItem = document.createElement('div');
                        emptyItem.className = 'audit-item empty';
                        emptyItem.textContent = 'No rules triggered';
                        auditDiv.appendChild(emptyItem);
                    } else {
                        reasons.forEach(reason => {
                            const item = document.createElement('div');
                            item.className = 'audit-item';
                            item.textContent = String(reason);
                            auditDiv.appendChild(item);
                        });
                    }
                    tdAudit.appendChild(auditDiv);
                    tr.appendChild(tdAudit);

                    tableBody.appendChild(tr);
                });

                loading.style.display = 'none';
                content.style.display = 'block';

            } catch (err) {
                console.error('Error fetching leads:', err);
                loading.style.display = 'none';
                authPrompt.style.display = 'block';
                alert('Failed to connect to the API. Verify your API key and connection.');
            }
        }

        if (savedKey) {
            fetchLeads(savedKey);
        } else {
            authPrompt.style.display = 'block';
        }
    </script>
</body>
</html>
